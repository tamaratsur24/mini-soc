name: mini-soc
services:
  server:
    build: .
    command: ["python", "lab_server.py", "--host", "0.0.0.0", "--log", "/logs/lab_auth.log", "--alerts", "/logs/lab_alerts.log", "--failure-limit", "${FAILURE_LIMIT:-5}", "--window-seconds", "${RATE_WINDOW_SECONDS:-60}"]
    ports:
      - "127.0.0.1:${LAB_PORT:-8000}:8000"
    volumes:
      - ./docker-logs:/logs
    init: true
  detector:
    build: .
    command: ["python", "detect_failed_logins.py", "--log", "/logs/lab_auth.log", "--alerts", "/logs/lab_alerts.log", "--watch", "--threshold", "${DETECTION_THRESHOLD:-5}", "--window-seconds", "${DETECTION_WINDOW_SECONDS:-60}", "--username-threshold", "${USERNAME_THRESHOLD:-5}", "--success-threshold", "${SUCCESS_THRESHOLD:-3}"]
    volumes:
      - ./docker-logs:/logs
    depends_on:
      - server
    init: true
